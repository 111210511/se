<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Web 版類 curl 工具</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; max-width: 600px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; max-width: 800px; border: 1px solid #ccc; min-height: 50px; }
    </style>
</head>
<body>
    <h1>Web 版類 curl 工具</h1>
    
    <div class="form-group">
        <label>URL (必填):</label>
        <input type="text" id="urlInput" value="https://jsonplaceholder.typicode.com/todos/1" placeholder="請輸入完整網址，包含 http 或 https">
    </div>
    
    <div class="form-group">
        <label>HTTP 請求方法 (Method):</label>
        <select id="methodInput">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>Headers (JSON 格式, 選填):</label>
        <textarea id="headersInput" rows="3" placeholder='例如: {"Content-Type": "application/json"}'></textarea>
    </div>
    
    <div class="form-group">
        <label>Data (POST / PUT 夾帶資料使用, 選填):</label>
        <textarea id="dataInput" rows="3" placeholder="請輸入要傳送的資料內容"></textarea>
    </div>
    
    <button onclick="sendRequest()">發送請求</button>

    <h2>伺服器回應:</h2>
    <p id="statusOutput"></p>
    <pre id="responseOutput">等待請求中...</pre>

    <script>
        async function sendRequest() {
            const url = document.getElementById('urlInput').value.trim();
            const method = document.getElementById('methodInput').value;
            const headersStr = document.getElementById('headersInput').value.trim();
            const dataStr = document.getElementById('dataInput').value;
            
            const responseOutput = document.getElementById('responseOutput');
            const statusOutput = document.getElementById('statusOutput');
            
            if (!url) {
                responseOutput.textContent = "請輸入 URL";
                statusOutput.textContent = "";
                return;
            }

            responseOutput.textContent = "載入中，請稍候...";
            statusOutput.textContent = "";

            let options = {
                method: method,
                headers: {}
            };

            if (headersStr) {
                try {
                    options.headers = JSON.parse(headersStr);
                } catch (e) {
                    responseOutput.textContent = "Headers 格式錯誤，請確認輸入的是合法的 JSON 格式。";
                    return;
                }
            }

            if ((method === 'POST' || method === 'PUT') && dataStr) {
                options.body = dataStr;
            }

            try {
                const response = await fetch(url, options);
                statusOutput.textContent = "HTTP 狀態碼: " + response.status;
                
                const text = await response.text();
                
                try {
                    const json = JSON.parse(text);
                    responseOutput.textContent = JSON.stringify(json, null, 2);
                } catch (e) {
                    responseOutput.textContent = text;
                }
            } catch (error) {
                statusOutput.textContent = "請求失敗";
                responseOutput.textContent = "錯誤訊息: " + error.message + "\n\n注意事項：網頁版發送請求會受到瀏覽器的 CORS (跨來源資源共用) 安全限制。如果你請求的網站不允許跨域讀取，瀏覽器會強制阻擋此請求。";
            }
        }
    </script>
</body>
</html>
